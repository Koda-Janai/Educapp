name: Compilar Educapp para simulador

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/educapp-simulador.yml'

permissions:
  contents: read

jobs:
  compilar:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APP_NAME: IniciodeSesionOct

    steps:
      - name: Obtener el código
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Compilar para iOS Simulator
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild \
            -project Login1.xcodeproj \
            -target "$APP_NAME" \
            -configuration Debug \
            -sdk iphonesimulator \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=26.0 \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/educapp-build" \
            build

      - name: Verificar y empaquetar la app
        shell: bash
        run: |
          app="$RUNNER_TEMP/educapp-build/$APP_NAME.app"
          plist="$app/Info.plist"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$plist")" = iphonesimulator
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist")" = 26.0
          ejecutable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          xcrun lipo -verify_arch arm64 "$app/$ejecutable"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/Educapp-Appetize.zip"

      - name: Guardar el ZIP para Appetize
        uses: actions/upload-artifact@v4
        with:
          name: Educapp-simulador
          path: ${{ runner.temp }}/Educapp-Appetize.zip
          if-no-files-found: error
          retention-days: 7
