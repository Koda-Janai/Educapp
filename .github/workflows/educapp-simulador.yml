name: Verificar Educapp en Xcode

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/educapp-simulador.yml'
      - 'Login1/**'
      - 'Login1.xcodeproj/project.pbxproj'

permissions:
  contents: read

jobs:
  verificar:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APP_NAME: IniciodeSesionOct

    steps:
      - name: Obtener el código
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Compilar con la configuración del proyecto
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild \
            -project Login1.xcodeproj \
            -target "$APP_NAME" \
            -configuration Debug \
            -sdk iphonesimulator \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/educapp-build" \
            build

      - name: Instalar y abrir en iPhone 17 con iOS 26.5
        timeout-minutes: 6
        shell: bash
        run: |
          app="$RUNNER_TEMP/educapp-build/$APP_NAME.app"
          plist="$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist")" = 26.5
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"

          dispositivo="$(xcrun simctl list devices available -j | jq -er '
            .devices["com.apple.CoreSimulator.SimRuntime.iOS-26-5"]
            | map(select(.name == "iPhone 17" and .isAvailable))
            | first.udid
          ')"
          xcrun simctl boot "$dispositivo"
          resultado=""
          for intento in {1..24}; do
            if xcrun simctl install "$dispositivo" "$app" &&
               resultado="$(xcrun simctl launch "$dispositivo" "$bundle_id")"; then
              break
            fi
            sleep 5
          done
          test -n "$resultado"
          echo "$resultado"
          pid="${resultado##*: }"
          sleep 5
          kill -0 "$pid"
          xcrun simctl io "$dispositivo" screenshot "$RUNNER_TEMP/Educapp-inicio.png"

      - name: Guardar captura de arranque
        uses: actions/upload-artifact@v4
        with:
          name: Educapp-inicio-iOS-26.5
          path: ${{ runner.temp }}/Educapp-inicio.png
          if-no-files-found: error
          retention-days: 7
